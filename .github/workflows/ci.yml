name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workpulse-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit tests and integration tests (Testcontainers)
        run: ./mvnw -B verify
      - name: Build container image
        run: docker build -t workpulse-backend:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            workpulse-backend/target/surefire-reports
            workpulse-backend/target/failsafe-reports

  web:
    name: Web portal (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workpulse-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workpulse-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Build container image
        run: docker build -t workpulse-web:ci .

  agent-electron:
    name: Desktop agent (Electron)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: workpulse-agent/electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workpulse-agent/electron/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  agent-dotnet:
    name: Desktop agent (.NET service and collector)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: workpulse-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore WorkPulse.Agent.sln
      - run: dotnet build WorkPulse.Agent.sln --configuration Release --no-restore

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: npm audit (web)
        working-directory: workpulse-web
        run: npm ci --ignore-scripts && npm audit --audit-level=high
        continue-on-error: true
      - name: npm audit (electron)
        working-directory: workpulse-agent/electron
        run: npm ci --ignore-scripts && npm audit --audit-level=high
        continue-on-error: true
